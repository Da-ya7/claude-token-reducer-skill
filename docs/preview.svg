  <g filter="url(#softGlow)">
    <text x="1080" y="325" fill="#eff7ff" font-family="Trebuchet MS, Segoe UI, sans-serif" font-size="52" font-weight="700">812 lines</text>
    <text x="1080" y="415" fill="#4cf2d1" font-family="Trebuchet MS, Segoe UI, sans-serif" font-size="72" font-weight="800">→</text>
