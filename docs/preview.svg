  <path d="M620 410C680 370 720 350 770 350" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 20" opacity="0.8"/>
  <path d="M620 450C690 450 725 450 790 450" fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round" opacity="0.8"/>
